<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Project Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-container h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #007BFF;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .form-group button:hover {
            background-color: #0056b3;
        }
        .rating {
            text-align: left;
        }
        .rating div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>RESTAURANT RECOMMENDATIONS FEEDBACK</h2>
        <form action="/submit" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="restaurant_name">Restaurant Name</label>
                <input type="text" id="restaurant_name" name="restaurant_name" placeholder="Enter the restaurant name" required>
            </div>
            
            <label>Rate Restaurant</label><br>
            <div class="rating">
                <div>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1"> &#9733;</label><br>
                </div>
                <div>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">&#9733;&#9733;</label><br>
                </div>
                <div>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">&#9733;&#9733;&#9733;</label><br>
                </div>
                <div>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">&#9733;&#9733;&#9733;&#9733;</label><br>
                </div>
                <div>
                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">&#9733;&#9733;&#9733;&#9733;&#9733;</label><br>
                </div>
            </div>
            
            <div class="form-group">
                <label for="rateUS">Rate Us</label>
                <select id="rateUS" name="rateUS" required>
                    <option value="" disabled selected>Select your Rating Here...</option>
                    <option value="Excellent">Excellent</option>
                    <option value="Good">Good</option>
                    <option value="Average">Average</option>
                    <option value="Bad">Bad</option>
                    <option value="Poor/Very Bad">Poor/Very Bad</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Rate our Service here.."></textarea>
            </div>
            
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
